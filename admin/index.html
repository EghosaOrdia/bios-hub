<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - BIOS Hub</title>

    <meta
      name="description"
      content="Manage your BIOS Hub profile, uploaded files, and activity. View and organize your BIOS submissions and contributions."
    />
    <meta property="og:site_name" content="BIOS Hub" />
    <meta property="og:title" content="Admin Dashboard - BIOS Hub" />
    <meta
      property="og:description"
      content="Manage your BIOS Hub profile, uploaded files, and activity. View and organize your BIOS submissions and contributions."
    />
    <meta
      property="og:url"
      content="https://www.bioshub.net/admin/index.html"
    />
    <meta property="og:type" content="website" />

    <!-- Styles -->
    <link rel="stylesheet" href="../styles/main.css" />

    <!-- Scripts -->
    <script defer src="../scripts/main.js"></script>
    <script defer src="../scripts/handle-form.js"></script>
  </head>
  <body>
    <div class="overlay"></div>

    <!-- ================= HEADER ================= -->

    <main class="admin-main">
      <aside class="aside">
        <div class="header__logo">
          <a href="#" class="logo__link">
            <img
              src="images/logo-dark.svg"
              alt="BIOS Hub logo"
              class="logo__img"
            />
          </a>
          <span class="logo__text">BIOS Hub</span>
        </div>

        <ul class="admin__links">
          <li class="admin__link">
            <img src="" alt="" class="admin-link__img" />
            <span class="admin-link__span">Dashboard</span>
          </li>
          <li class="admin__link">
            <img src="" alt="" class="admin-link__img" />
            <span class="admin-link__span">User Profile</span>
          </li>
          <li class="admin__link">
            <img src="" alt="" class="admin-link__img" />
            <span class="admin-link__span">BIOS Files</span>
          </li>
          <li class="admin__link">
            <img src="" alt="" class="admin-link__img" />
            <span class="admin-link__span">My Activity</span>
          </li>
        </ul>

        <div class="admin-actions">
          <div class="admin-user">
            <img src="" alt="" />
            <span>Username</span>
            <span>BIOS Master</span>
          </div>
          <div class="admin__settings">
            <img src="" alt="" />
            <span>Settings</span>
          </div>
          <div class="admin__logout">
            <img src="" alt="" />
            <span>Logout</span>
          </div>
        </div>
      </aside>
      <section class="section-main">
        <div class="admin-section__heading">
          <div class="admin-section__meta">
            <h1 class="admin-section__header"></h1>
            <p class="admin-section__subtext"></p>
          </div>
          <button class="button admin-section__button">Edit Profile</button>
        </div>

        <div class="admin-stats">
          <div class="admin__stat">
            <h2></h2>
            <p></p>
          </div>
          <div class="admin__stat">
            <h2></h2>
            <p></p>
          </div>
          <div class="admin__stat">
            <h2></h2>
            <p></p>
          </div>
          <div class="admin__stat">
            <h2></h2>
            <p></p>
          </div>
        </div>

        <div class="admin-section__navigation"></div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">© 2025 BIOS Hub. All rights reserved.</p>
      <nav class="footer--nav">
        <a class="nav__link">Privacy</a>
        <a class="nav__link">Terms</a>
        <a class="nav__link">Contact</a>
      </nav>
    </footer>
  </body>
</html>
